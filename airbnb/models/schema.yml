models:
  - name: dim_listings_cleansed
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000 # Comprueba que la tabla tenga al menos 1000 filas.
    columns:
      - name: listing_id
        data_tests:
          - unique # Comprueba que no haya valores duplicados.
          - not_null # Comprueba que no haya valores nulos.

      - name: host_id
        data_tests:
          - not_null
          - relationships: # Comprueba que el host exista en dim_hosts_cleansed.
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values: # Solo permite los siguientes tipos de alojamiento.
              arguments:
                values:
                  - 'Entire home/apt'
                  - 'Private room'
                  - 'Shared room'
                  - 'Hotel room'
    
      - name:  minimum_nights
        data_tests:
          - positive_values # Test generico singular para comprobar que los valores sean positivos.


  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true # Exige que las columnas y sus tipos cumplan el contrato.

    columns:
      - name: host_id
        data_type: integer
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        data_type: timestamp

      - name: created_at
        data_type: timestamp

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - relationships: # Comprueba que el alojamiento exista en dim_listings_cleansed.
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        data_tests:
          - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']