models:
  - name: dim_listings_cleansed
    columns:

     - name: listing_id
       data_tests:
         - unique # Prueba que la columna listing_id no tenga valores duplicados. Es una prueba predefinida en DBT
         - not_null # Prueba que la columna listing_id no tenga valores nulos. Es una prueba predefinida en DBT

     - name: host_id
       data_tests:
         - not_null # Prueba que la columna host_id no tenga valores nulos. Es una prueba predefinida en DBT
         - relationships: # La columna host_id tiene una relación con la columna host_id de la tabla dim_hosts_cleansed. Esto significa que todos los valores de host_id en dim_listings_cleansed deben existir en dim_hosts_cleansed.  
             arguments:
               to: ref('dim_hosts_cleansed') #Referencia a la tabla dim_hosts_cleansed
               field: host_id

     - name: room_type
       data_tests:
         - accepted_values: # Prueba que la columna room_type solo tenga valores aceptados. Es una prueba predefinida en DBT
             arguments:
               values: ['Entire home/apt',
                        'Private room', # Valores aceptados para la columna room_type.
                        'Shared room',
                        'Hotel room']
     
  - name: dim_hosts_cleansed
    columns:

     - name: host_id
       data_tests:
         - unique # Prueba que la columna hosts_id no tenga valores duplicados. Es una prueba predefinida en DBT
         - not_null # Prueba que la columna hosts_id no tenga valores nulos. Es una prueba predefinida en DBT
     
     - name: host_name
       data_tests:
          - not_null 

     - name: is_superhost
       data_tests:
          - accepted_values: # Prueba que la columna is_superhost solo tenga valores aceptados. Es una prueba predefinida en DBT
              arguments:
                values: ['t', 'f'] # Valores aceptados para la columna is_superhost.               

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - relationships: #Prueba que la columna listing_id tiene una relación con la columna listing_id de la tabla dim_listings_cleansed. 
              arguments:
                to: ref('dim_listings_cleansed') 
                field: listing_id

      - name: reviewer_name
        data_tests:
           - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
               arguments:
                 values: ['positive', 'neutral', 'negative']