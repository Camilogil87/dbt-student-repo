unit_tests:
  - name: unittest_fullmoon_matcher
    model: mart_fullmoon_reviews  #Nombre del modelo que se va a probar
    given:
      - input: ref('fct_reviews')
        rows:
          - {review_date: '2025-01-13'} #Filas de prueba para la tabla fct_reviews
          - {review_date: '2025-01-14'}
          - {review_date: '2025-01-15'}
      - input: ref('seed_full_moon_dates') #Filas de prueba para la tabla seed_full_moon_dates
        rows:
          - {full_moon_date: '2025-01-14'}
    expect:
      rows:
        - {review_date: '2025-01-13', is_full_moon: "not full moon"} # Resultados esperado de la prueba unitaria
        - {review_date: '2025-01-14', is_full_moon: "not full moon"}
        - {review_date: '2025-01-15', is_full_moon: "full moon"}